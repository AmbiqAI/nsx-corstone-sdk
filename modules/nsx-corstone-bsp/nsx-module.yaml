schema_version: 1
module:
  name: nsx-corstone-bsp
  type: backend_specific
  version: 0.1.0
licenses:
  .: BSD-3-Clause
support:
  ambiqsuite: false
  corstone: true
  zephyr: false
build:
  cmake:
    package: nsx_corstone_bsp
    targets:
    - nsx::bsp
depends:
  required:
  - nsx-corstone-soc
  optional: []
compatibility:
  boards:
  - corstone300_fvp_u55
  - corstone310_fvp_u55
  - corstone320_fvp_u85
  socs:
  - corstone300
  - corstone310
  - corstone320
  toolchains:
  - arm-none-eabi-gcc
contracts:
  provides:
    bsp:
      versions:
      - 2
      socs:
      - corstone300
      - corstone310
      - corstone320
